version: '3.8'

services:
  # 1. MongoDB Database Container
  bitetown-mongodb:
    image: mongo:7.0
    container_name: bitetown-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: bitetown_db
    volumes:
      - bitetown_mongo_data:/data/db

  # 2. Mongo Express (Browser GUI to view database data like phpMyAdmin)
  bitetown-mongo-express:
    image: mongo-express:1.0.0-alpha.4
    container_name: bitetown-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@bitetown-mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: pass
    depends_on:
      - bitetown-mongodb

volumes:
  bitetown_mongo_data:
    driver: local